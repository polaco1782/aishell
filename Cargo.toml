[package]
name = "aishell"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Generate shell commands from natural-language prompts"
license = "MIT"

[[bin]]
name = "ai"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
rpassword = "7.5"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "1.1.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3.20"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
