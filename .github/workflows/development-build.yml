name: Development build

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux-x86_64:
    name: Linux x86_64
    permissions:
      contents: read
    uses: ./.github/workflows/linux-build.yml
    with:
      checkout-ref: ${{ github.sha }}
      build-label: development
      archive-name: aishell-development-linux-x86_64.tar.gz
      artifact-name: aishell-development-linux-x86_64-${{ github.sha }}
      retention-days: 14
